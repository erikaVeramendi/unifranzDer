<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <linearGradient id="unifranzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Dynamic Isometric Emblem -->
  <g transform="translate(15, 18)">
    <polygon points="42,0 84,22 84,66 42,88 0,66 0,22" fill="#121212" stroke="url(#unifranzGrad)" stroke-width="3.5"/>
    <path d="M22 26 V54 C22 65 30 71 42 71 C54 71 62 65 62 54 V26" stroke="url(#unifranzGrad)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="42" cy="24" r="5" fill="#FFFFFF"/>
  </g>

  <!-- UNIFRANZ Main Logotype -->
  <text x="118" y="68" fill="#FFFFFF" font-family="'Orbitron', 'Space Grotesk', 'Inter', sans-serif" font-weight="900" font-size="54" letter-spacing="4">
    UNI<tspan fill="url(#unifranzGrad)">FRANZ</tspan>
  </text>

  <!-- Subtitle & Tech Accent Line -->
  <rect x="120" y="80" width="95" height="3" rx="1.5" fill="url(#unifranzGrad)" />
  <text x="225" y="85" fill="#CCCCCC" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="600" font-size="11.5" letter-spacing="3.5">
    INNOVACIÓN EN EDUCACIÓN
  </text>
</svg>
